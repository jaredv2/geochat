<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GeoChat V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="/" class="logo">
      <span class="logo-bracket">[</span>GEO<span class="logo-accent">CHAT</span><span class="logo-bracket">]</span>
      <span class="logo-version">v3</span>
    </a>
    <div class="search-wrap">
      <input id="searchInput" class="search-input" type="text" placeholder="search places…" autocomplete="off">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="heatmapToggle" title="Heatmap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
    </button>
    <div class="radius-wrap">
      <label class="radius-label">R:<span id="radiusVal">off</span></label>
      <input id="radiusSlider" type="range" min="0" max="200" step="5" value="0" class="radius-slider">
    </div>
    <a href="/leaderboard" class="icon-btn" title="Leaderboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    </a>
    {% if user %}
    <button class="icon-btn notif-btn" id="notifBtn" title="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-badge" id="notifBadge" style="display:none">0</span>
    </button>
    <a href="/profile" class="user-chip">
      <img src="{{ user.avatar_url }}" class="chip-avatar" alt="">
      <span class="chip-name">{{ user.username }}</span>
    </a>
    {% if user.is_admin %}
    <a href="/admin" class="admin-badge">ADMIN</a>
    {% endif %}
    <a href="/logout" class="btn-ghost-sm">exit</a>
    {% else %}
    <a href="/login" class="btn-discord">
      <svg width="16" height="12" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.4.9a.2.2 0 0 0-.2.1 40.8 40.8 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A37.7 37.7 0 0 0 25.4 1a.2.2 0 0 0-.2-.1A58.3 58.3 0 0 0 10.5 5a.2.2 0 0 0-.1.1C1.5 18.7-1 32 .3 45.1a.2.2 0 0 0 .1.1 58.8 58.8 0 0 0 17.7 9 .2.2 0 0 0 .2-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4c.4-.3.7-.6 1.1-.9a.2.2 0 0 1 .2 0c11.6 5.3 24.1 5.3 35.5 0a.2.2 0 0 1 .2 0l1.1.9a.2.2 0 0 1 0 .4 36.2 36.2 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.1 47.1 0 0 0 3.6 5.9.2.2 0 0 0 .2.1 58.6 58.6 0 0 0 17.8-9 .2.2 0 0 0 .1-.1C72.2 30 68.4 16.8 60.2 5a.2.2 0 0 0-.1-.1zM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.7 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z"/></svg>
      Login
    </a>
    {% endif %}
  </div>
</header>

<div id="map"></div>

<div class="map-hint" id="mapHint">
  <span class="blink">▋</span> click map to open a channel
</div>

<div class="live-indicator" id="liveIndicator" style="display:none">
  <span class="live-dot"></span> LIVE
</div>

<!-- Notification dropdown -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-head">
    <span class="mono">// notifications</span>
    <button id="markAllRead" class="btn-link">mark read</button>
  </div>
  <div class="notif-list" id="notifList"><div class="empty-mono">no notifications</div></div>
</div>

<!-- Badge toast -->
<div class="badge-toast" id="badgeToast" style="display:none">
  <div class="badge-toast-inner" id="badgeToastInner"></div>
</div>

<!-- Report modal -->
<div class="modal-overlay" id="reportOverlay" style="display:none">
  <div class="modal">
    <div class="modal-title mono">// report message</div>
    <textarea id="reportReason" class="modal-textarea" placeholder="Why are you reporting this?" maxlength="200"></textarea>
    <div class="modal-btns">
      <button class="btn-ghost-sm" onclick="closeReport()">cancel</button>
      <button class="btn-danger" onclick="submitReport()">report</button>
    </div>
  </div>
</div>

<!-- Side Panel -->
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-title-row">
      <span class="panel-sigil">▸</span>
      <div>
        <div class="panel-place" id="panelPlace">—</div>
        <div class="panel-coords mono" id="panelCoords"></div>
      </div>
    </div>
    <div class="panel-head-right">
      <span class="live-chip" id="livechip" style="display:none"><span class="live-dot-sm"></span>live</span>
      <button class="panel-close" id="panelClose">✕</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="chat">Chat</button>
    <button class="tab" data-tab="top">Top</button>
  </div>

  <div class="tab-content active" id="tab-chat">
    <div class="messages-list" id="messagesList"></div>
    <div class="compose-area" id="composeArea">
      {% if user %}
      <div class="compose-row">
        <img src="{{ user.avatar_url }}" class="compose-avatar" alt="">
        <div class="compose-box">
          <textarea id="msgInput" placeholder="type a message… (ctrl+enter)" maxlength="500" rows="2"></textarea>
          <div class="compose-footer">
            <span class="char-counter mono"><span id="charCount">0</span>/500</span>
            <button class="btn-post" id="postBtn">send ↵</button>
          </div>
        </div>
      </div>
      {% else %}
      <a href="/login" class="login-bar">
        <svg width="15" height="11" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.4.9a.2.2 0 0 0-.2.1 40.8 40.8 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A37.7 37.7 0 0 0 25.4 1a.2.2 0 0 0-.2-.1A58.3 58.3 0 0 0 10.5 5a.2.2 0 0 0-.1.1C1.5 18.7-1 32 .3 45.1a.2.2 0 0 0 .1.1 58.8 58.8 0 0 0 17.7 9 .2.2 0 0 0 .2-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4c.4-.3.7-.6 1.1-.9a.2.2 0 0 1 .2 0c11.6 5.3 24.1 5.3 35.5 0a.2.2 0 0 1 .2 0l1.1.9a.2.2 0 0 1 0 .4 36.2 36.2 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.1 47.1 0 0 0 3.6 5.9.2.2 0 0 0 .2.1 58.6 58.6 0 0 0 17.8-9 .2.2 0 0 0 .1-.1C72.2 30 68.4 16.8 60.2 5a.2.2 0 0 0-.1-.1zM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.7 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z"/></svg>
        login with discord to chat
      </a>
      {% endif %}
    </div>
  </div>

  <div class="tab-content" id="tab-top">
    <div class="top-wrap" id="topWrap"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>window.CURRENT_USER = {{ user | tojson if user else 'null' }};</script>
<script src="/static/script.js"></script>
</body>
</html>
